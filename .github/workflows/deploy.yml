name: Build Discover feed & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *' # refresh data/discover.json every 6 hours
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Discover feed
        run: node scripts/build-discover.mjs || echo "feed build failed, deploying the committed data/discover.json"
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html css src data _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
